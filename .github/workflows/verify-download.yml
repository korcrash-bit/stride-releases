name: Verify public APK download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-download.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out verified original APK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download public release without authentication
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 90 --output downloaded.apk 'https://github.com/korcrash-bit/stride-releases/releases/download/v0.3.4/STRIDE-0.3.4.apk'
          test "$(wc -c < downloaded.apk | tr -d ' ')" = "3634486"
          echo 'f63f445a7fdc15024844699721c33f7a507befcffdead09f49a635617a671041  downloaded.apk' | sha256sum --check
          cmp apk/STRIDE-0.3.4.apk downloaded.apk
          echo 'Verified public download: 3634486 bytes'
          sha256sum downloaded.apk
