name: Publish verified STRIDE APK
on:
  push:
    branches: [main]
    paths: ['apk/STRIDE-0.4.0.apk']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stride-android-v0.4.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out distribution files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify APK before publishing
        run: |
          test "$(wc -c < apk/STRIDE-0.4.0.apk | tr -d ' ')" = "3638146"
          sha256sum --check SHA256SUMS.txt
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.4.0 apk/STRIDE-0.4.0.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "STRIDE Android v0.4.0" --notes-file RELEASE_NOTES.md
